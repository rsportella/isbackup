# isbackup no Docker Desktop (ou qualquer Docker com Compose).
#
#   docker compose up -d          # constroi a imagem e sobe
#   open http://localhost:8787    # painel
#
# Recomendado: ./docker.sh (pergunta onde guardar os dados e abre o navegador).
# Sem ele, config, chave das senhas, backups e logs ficam em ./docker-data.

services:
  isbackup:
    build: .
    image: isbackup:local
    # A imagem e construida aqui, nao existe num registry: sem isso o Compose tenta baixa-la
    # antes e mostra um "pull access denied" que parece erro.
    pull_policy: build
    container_name: isbackup
    restart: unless-stopped
    ports:
      # So o seu computador acessa o painel (ele nao tem login). Nao troque por "8787:8787".
      - "127.0.0.1:${ISBACKUP_PORT:-8787}:8787"
    environment:
      # Fuso das rotinas ("todo dia as 3h" = 3h nesse fuso)
      TZ: ${TZ:-America/Sao_Paulo}
      # So pra exibicao: o painel mostra onde os backups ficam no SEU computador.
      ISBACKUP_HOST_DATA: ${ISBACKUP_DATA:-${PWD}/docker-data}
    volumes:
      # Pasta dos dados no seu computador. O ./docker.sh pergunta na 1a vez (e grava em
      # docker.local.env); sem ele, fica em ./docker-data.
      - ${ISBACKUP_DATA:-./docker-data}:/data
      - isbackup-cron:/var/spool/cron/crontabs

volumes:
  # Guarda o crontab instalado pelo painel entre recriacoes do container
  isbackup-cron:
